name: 'VRP helper: probe Gemini model'
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'model id to probe'
        required: true
permissions:
  contents: 'read'
jobs:
  probe:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 3
    steps:
      - name: 'Probe model'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          MODEL: '${{ github.event.inputs.model }}'
        run: |-
          CODE=$(curl -sS -m 60 -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "X-goog-api-key: ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent" \
            -d '{"contents":[{"parts":[{"text":"ping"}]}]}')
          echo "PROBE_RESULT HTTP=${CODE}"
          python3 -c "import json; d=json.load(open('/tmp/resp.json')); print('BODY:', json.dumps(d)[:300])" 2>/dev/null || head -c 300 /tmp/resp.json
